name: AI Studio auto-patch ingest

on:
  repository_dispatch:
    types: [app-updated, app_manifest_updated, school-apps-updated]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ai-studio-auto-patch-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify promotion credential
        shell: bash
        env:
          SAFE_PROMOTION_TOKEN: ${{ secrets.SAFE_PROMOTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SAFE_PROMOTION_TOKEN:-}" ]; then
            echo "::error::Missing SAFE_PROMOTION_TOKEN. Auto-patch ingest is fail-closed."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: candidate
          fetch-depth: 0
          token: ${{ secrets.SAFE_PROMOTION_TOKEN }}

      - name: Verify candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main candidate
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::candidate is not based on current main; refusing auto-patch mutation."
            exit 1
          fi
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify signed access bundle freshness
        run: npm run access:check:required

      - name: Synchronise application manifests
        run: npm run sync

      - name: Format generated registry files
        run: npm run format:generated-json

      - name: Verify declared deployment release identities
        run: node scripts/verify-deployment-release-identities.mjs

      - name: Verify live sources and determine eligible patch promotions
        run: npm run qa:ecosystem:verified

      - name: Apply verified patch promotions
        run: node scripts/apply-auto-promotions.mjs qa-results/release-promotion-report.json src/config/release-wave.json

      - name: Bind Studio patch version to verified promotion
        shell: bash
        run: |
          set -euo pipefail
          wave_changed=false
          registry_changed=false
          if ! git diff --quiet -- src/config/release-wave.json; then
            wave_changed=true
          fi
          if ! git diff --quiet -- src/config/apps.generated.json; then
            registry_changed=true
          fi
          if [ "$wave_changed" != "true" ] && [ "$registry_changed" != "true" ]; then
            echo "AUTO_PATCH_CHANGED=false" >> "$GITHUB_ENV"
            echo "No verified release-wave or app-registry delta; Studio version remains unchanged."
            exit 0
          fi

          echo "AUTO_PATCH_WAVE_CHANGED=$wave_changed" >> "$GITHUB_ENV"
          echo "AUTO_PATCH_REGISTRY_CHANGED=$registry_changed" >> "$GITHUB_ENV"
          npm run release:patch -- --auto-patch
          echo "AUTO_PATCH_CHANGED=true" >> "$GITHUB_ENV"

      - name: Persist verified promotion and Studio release metadata to candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AUTO_PATCH_CHANGED:-false}" != "true" ]; then
            echo "No verified release-wave delta; safe NO-OP."
            exit 0
          fi

          git fetch --no-tags origin candidate
          remote_candidate="$(git rev-parse origin/candidate)"
          if [ "$remote_candidate" != "$BASE_SHA" ]; then
            echo "::error::candidate advanced during ingest ($BASE_SHA -> $remote_candidate); refusing stale persistence."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/config/release-wave.json \
            src/config/apps.generated.json \
            src/config/sync-report.json \
            src/config/ai-readiness.generated.json \
            package.json \
            package-lock.json \
            ghrab-platform.consumer.json \
            src/index.html \
            src/config/release-acceptance.json \
            reporter-test.config.json \
            src/tests/error-reporter-adapter.js \
            src/manifest.webmanifest \
            qa/qa-manifest.json \
            src/config/changelog.json \
            README.md \
            BEZPECNOST.md \
            AUTOMATIZACE-GITHUB.md \
            RELEASE-CHECKLIST.md \
            ARCHITEKTURA.md \
            POSTUP-NAHRANI.md \
            NAHRANI-NA-GITHUB.md

          if git diff --cached --quiet; then
            echo "::error::Auto-patch expected a staged Studio release delta but index is empty."
            exit 1
          fi

          studio_version="$(node -p "require('./package.json').version")"
          git commit -m "chore: stage verified app auto-promotion (Studio ${studio_version})"
          git push origin HEAD:candidate
