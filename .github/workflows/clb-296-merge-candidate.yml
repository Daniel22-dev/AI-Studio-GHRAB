name: CLB PR296 rebase-safe integration onto current candidate (FEATURE ONLY)
on:
  push:
    branches: [fix/clb-studio-deployment-contract-20261019]
    paths: ['.github/workflows/clb-296-merge-candidate.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clb-296-reconcile-candidate
  cancel-in-progress: false
jobs:
  merge-feature-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge candidate in isolated branch, reject unrelated application changes
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/candidate:refs/remotes/origin/candidate
          original="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          candidate_sha="$(git rev-parse refs/remotes/origin/candidate)"
          echo "SOURCE_BRANCH_HEAD=$original"
          echo "MAIN_SHA=$main_sha"
          echo "CANDIDATE_SHA=$candidate_sha"
          test "$main_sha" = "$candidate_sha"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git merge -X theirs --no-ff --no-edit -m "chore(clb): preserve candidate app promotion while integrating verified MASTER teacher fix" "$candidate_sha"
          python3 - <<'PY'
          import subprocess
          base=subprocess.check_output(['git','rev-parse','HEAD^2'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed={
            '.github/workflows/clb-296-merge-probe.yml',
            '.github/workflows/clb-296-merge-candidate.yml',
            '.github/workflows/clb-publication.yml',
            '.github/workflows/clb-studio-contract.yml',
            'CHANGELOG.md',
            'scripts/build.mjs',
            'scripts/lib/clb-master-integrity.mjs',
            'scripts/lib/clb-studio-adapter.mjs',
            'scripts/repair-clb-studio-contract.py',
            'scripts/test-clb-master-browser.cjs',
            'scripts/test-clb-secret-exceptions.mjs',
            'scripts/test-clb-studio-adapter.mjs',
            'scripts/test-production-dist-security.mjs',
            'scripts/test.mjs',
            'scripts/verify-clb-publication.mjs',
            'src/config/platform-consumers.json',
          }
          unexpected=set(paths)-allowed
          print('CHANGES_VS_CANDIDATE',paths,flush=True)
          assert not unexpected, 'Unrelated app or GIT changes forbidden: '+str(sorted(unexpected))
          package=__import__('json').loads(open('package.json').read())
          assert package['version']=='0.21.249'
          assert len(paths)>=10
          PY
          echo "RECONCILED_MERGE_SHA=$(git rev-parse HEAD)"
          echo "CLB_ONLY_CHANGES_VERIFIED"
      - name: Push ONLY feature branch when expected head still matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/clb-studio-deployment-contract-20261019'
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          actual="$(git -c "http.extraHeader=$auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          git -c "http.extraHeader=$auth" push origin "HEAD:refs/heads/$branch"
          echo "ONLY_FEATURE_BRANCH_UPDATED"
