name: CLB PR296 integration merge probe (read-only, no deployment)
on:
  push:
    branches: [fix/clb-studio-deployment-contract-20261019]
    paths: ['.github/workflows/clb-296-merge-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile candidate with current main without writes
        run: |
          git fetch --no-tags origin refs/heads/main
          echo "CLB_HEAD=$(git rev-parse HEAD)"
          echo "CURRENT_MAIN=$(git rev-parse FETCH_HEAD)"
          echo "CLB_MERGE_BASE=$(git merge-base HEAD FETCH_HEAD)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          set +e
          git merge --no-commit --no-ff -X theirs FETCH_HEAD
          status=$?
          set -e
          echo "CLB_MERGE_EXIT=$status"
          git status --short | head -80
          if test "$status" -ne 0; then
            echo "CONFLICTS"; git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --cached --name-only | head -60
          git diff FETCH_HEAD --name-only | head -80
          echo "CONFLICT_RESOLVED_PREVIEW_OK"
          node -e "const x=require('./package.json');console.log('CLB_MERGED_PACKAGE_VERSION='+x.version)"
      - name: Restore merged working tree to a plain branch (no remote writes)
        if: always()
        run: git merge --abort || true
