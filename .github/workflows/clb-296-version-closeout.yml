name: CLB PR296 Studio-only patch version closeout (FEATURE ONLY, NO DEPLOY)
on:
  push:
    branches: [fix/clb-studio-deployment-contract-20261019]
    paths: [.github/workflows/clb-296-version-closeout.yml]
permissions:
  contents: write
concurrency:
  group: clb-296-version-closeout
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bump Studio patch release without modifying GIT or lesson library
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = 0.21.249
          test "$(git rev-parse origin/main)" = "$(git rev-parse origin/candidate)"
          npm ci --ignore-scripts --no-audit --no-fund
          before="$(git ls-tree -r HEAD src/conversation-lab | sha256sum | cut -d' ' -f1)"
          npm run release:patch
          test "$(node -p "require('./package.json').version")" = 0.21.250
          python3 - <<'PY'
          import datetime,json,pathlib
          path=pathlib.Path('src/config/changelog.json')
          log=json.loads(path.read_text())
          assert log['current']=='0.21.250' and log['items'][0]['version']=='0.21.249'
          log['items'].insert(0,{
           'version':'0.21.250',
           'date':'2026-10-20',
           'title':{'cs':'Finální CSP a učitelské otevření Conversation Lab MASTER 0.11.0','en':'Final CSP and teacher access for Conversation Lab MASTER 0.11.0'},
           'changes':[
            {'cs':'Dokončené připojení původních 72 MASTER variant do chráněného učitelského prostředí AI Studia; studentské odkazy vedou na nezměněný anonymní Cloudflare HOSTFIX1.', 'en':'Completed exact 72-variant MASTER integration into the protected Studio teacher environment; student links continue to the unchanged anonymous Cloudflare HOSTFIX1.'},
            {'cs':'Učitelské HTML má povinnou CSP a časný ochranný rámcový guard. Kryptograficky ověřené původní lekce, slovníky, QR, skutečný obsahový podpis, bezpečnostní brány CLB-01 a verze GIT zůstávají nedotčeny.','en':'Teacher HTML enforces CSP and an early frame guard. Reviewed source lessons, dictionaries, QR links, the actual content signature, CLB-01 gates, and GIT version remain untouched.'},
            {'cs':'Oprava je oddělena od předchozího automatického povýšení 0.21.249; produkční vydání nadále vyžaduje úspěšný úplný projektový QA, P5 a live-parity.','en':'This fix is separate from the prior 0.21.249 auto-promotion; production remains gated on complete project QA, P5 and live parity.'},
           ]
          })
          path.write_text(json.dumps(log,ensure_ascii=False,indent=2)+'\n')
          PY
          node scripts/generate-changelog.mjs
          npm run qa:doc-versions
          npm run verify:release-version
          after="$(git ls-tree -r HEAD src/conversation-lab | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed=set('README.md BEZPECNOST.md AUTOMATIZACE-GITHUB.md RELEASE-CHECKLIST.md ARCHITEKTURA.md POSTUP-NAHRANI.md NAHRANI-NA-GITHUB.md package.json package-lock.json ghrab-platform.consumer.json src/index.html src/config/release-acceptance.json reporter-test.config.json src/tests/error-reporter-adapter.js src/manifest.webmanifest qa/qa-manifest.json src/config/changelog.json CHANGELOG.md'.split())
          assert files and not (files-allowed), 'Unexpected change outside Studio release metadata: '+str(files-allowed)
          print('STUDIO_0_21_250_ONLY_METADATA_CHANGED',sorted(files),flush=True)
          PY
      - name: Commit to feature branch only after source/registry guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c "http.extraHeader=$auth" ls-remote origin refs/heads/fix/clb-studio-deployment-contract-20261019 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "chore(studio): independently release CLB CSP fix as 0.21.250 after app 0.21.249 promotion"
          git -c "http.extraHeader=$auth" push origin HEAD:refs/heads/fix/clb-studio-deployment-contract-20261019
          echo "FEATURE_ONLY_VERSION_COMMIT=$(git rev-parse HEAD)"
