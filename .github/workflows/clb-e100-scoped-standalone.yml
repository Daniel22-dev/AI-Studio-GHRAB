name: Conversation Lab E100 standalone scoped security release PRELIVE (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/integration/conversation-lab/teacher-launch.js'
      - 'scripts/test-conversation-lab-launcher.mjs'
      - 'scripts/test-clb-e100-scoped-standalone.mjs'
      - '.github/workflows/clb-e100-scoped-standalone.yml'
permissions:
  contents: read
jobs:
  future-release-guard-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-conversation-lab-launcher.mjs scripts/test-clb-e100-scoped-standalone.mjs
      - run: node scripts/garp27/conversation-lab-enrollment.mjs
      - run: node --test scripts/garp27/conversation-lab-enrollment.test.mjs
