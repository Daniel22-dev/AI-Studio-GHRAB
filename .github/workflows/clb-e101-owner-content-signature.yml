name: Conversation Lab E101 Owner signed B1 CONTENT check (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/integration/conversation-lab/owner-content-release.signed.json'
      - 'src/integration/conversation-lab/activation-gates.json'
      - 'scripts/test-clb-e101-owner-content-release.mjs'
      - '.github/workflows/clb-e101-owner-content-signature.yml'
permissions:
  contents: read
jobs:
  owner-public-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify ES256 owner signature with pinned existing Studio public key + negative mutations
        run: node --test scripts/test-clb-e101-owner-content-release.mjs
      - name: Preserve prelive launch hold pending independent security and P5
        run: node --test scripts/test-conversation-lab-owner-consent.mjs scripts/test-clb01-signed-access-promotion.mjs
