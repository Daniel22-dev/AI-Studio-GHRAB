name: CLB E108 signed 0.9.2 owner content PRELIVE (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/integration/conversation-lab/owner-content-release.v0.9.2.signed.json'
      - 'scripts/test-clb-e108-owner-signed-092.mjs'
      - '.github/workflows/clb-e108-v092-owner-es256-prelive.yml'
permissions:
  contents: read
jobs:
  owner-content-signed-092:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify real exact owner ES256 receipt versus original Studio trust anchor and unchanged 0.9.1 PRELIVE
        run: node --test scripts/test-clb-e108-owner-signed-092.mjs
      - name: Existing 0.9.1 trust & runtime must still verify unchanged
        run: |
          node --test scripts/test-clb-e101-owner-content-release.mjs
          node --test scripts/test-clb-e102-runtime-owner-receipt.mjs
      - name: Confirm PRELIVE control remains fail-closed
        run: node scripts/garp27/conversation-lab-enrollment.mjs
