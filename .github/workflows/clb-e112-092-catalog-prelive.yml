name: CLB E112 0.9.2 catalog intent only (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/integration/conversation-lab/catalog-activation.v0.9.2.candidate.json'
      - 'scripts/test-clb-e112-prelive-092-candidate.mjs'
      - '.github/workflows/clb-e112-092-catalog-prelive.yml'
permissions:
  contents: read
jobs:
  scoped-092-ten-app-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify only staged 0.9.2 catalog intent and exact signed content SHA
        run: node --test scripts/test-clb-e112-prelive-092-candidate.mjs
      - name: Confirm approved original PRELIVE still fails closed
        run: |
          node --test scripts/test-clb-e108-owner-signed-092.mjs
          node --test scripts/test-clb-e109-future-092-teacher-gate.mjs
          node scripts/garp27/conversation-lab-enrollment.mjs
