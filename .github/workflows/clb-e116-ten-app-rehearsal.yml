name: CLB E116 ten-app production candidate REHEARSAL (NO DEPLOY)
on:
  pull_request:
    branches: [candidate]
    paths:
      - 'src/config/apps.generated.json'
      - 'src/config/apps.fallback.json'
      - 'src/config/sources.json'
      - 'src/config/ai-readiness.generated.json'
      - 'src/config/platform-consumers.json'
      - 'src/config/release-wave.json'
      - 'src/config/sync-report.json'
      - 'scripts/test-clb-e116-ten-app-unapproved-release.mjs'
      - '.github/workflows/clb-e116-ten-app-rehearsal.yml'
permissions:
  contents: read
jobs:
  release-rehearsal-no-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify signed 0.9.2 tenth tile, original nine unchanged, and teacher launch remains BLOCKED
        run: node --test scripts/test-clb-e116-ten-app-unapproved-release.mjs
      - name: Verify all 11 platform consumer records are internally synchronized
        run: node scripts/sync-platform-consumers.mjs --check
      - name: Verify 10-app P5 ecosystem metadata with actual 0.9.2 live evidence
        run: node scripts/qa-ecosystem.mjs --require-source-verification
      - name: Verify the live 0.9.2 still matches all signed public assets
        run: node --test scripts/test-clb-e114-live-092-strict.mjs
      - name: Verify exact owner ES256 release signature (no independent GO claimed)
        run: node --test scripts/test-clb-e101-owner-content-release.mjs
