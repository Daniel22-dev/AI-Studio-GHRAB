name: CLB E117 isolated signed CLB-01 baseline with nine original apps (NO DEPLOY)
on:
  pull_request:
    branches: [candidate]
    paths:
      - 'src/integration/conversation-lab/**'
      - 'src/config/access-config-bundle*'
      - 'src/config/access-policy.json'
      - 'src/app/external/launcher.js'
      - '.github/workflows/clb-e117-minimal-signed-nine-app-baseline.yml'
permissions:
  contents: read
jobs:
  signed-nine-app-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify original 9-app ecosystem, Studio 0.21.243 metadata and signed CLB training
        run: |
          node scripts/sync-platform-consumers.mjs --check
          node scripts/qa-ecosystem.mjs --require-source-verification
          node --test scripts/test-clb01-signed-access-promotion.mjs
      - name: Verify actual content signatures, future 0.9.2 launcher and PRELIVE_HOLD
        run: |
          node --test scripts/test-clb-e101-owner-content-release.mjs
          node --test scripts/test-clb-e102-runtime-owner-receipt.mjs
          node --test scripts/test-clb-e108-owner-signed-092.mjs
          node --test scripts/test-clb-e109-future-092-teacher-gate.mjs
          node --test scripts/test-conversation-lab-launcher.mjs
          node --test scripts/test-clb-studio-portal-route.mjs
      - name: Check exact signed live B1 v0.9.2 origin
        run: node --test scripts/test-clb-e114-live-092-strict.mjs
