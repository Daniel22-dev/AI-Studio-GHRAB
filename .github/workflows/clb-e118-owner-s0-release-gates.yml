name: CLB E118 exact owner-approved signed 0.9.2 Studio production gates (NO DEPLOY)
on:
  pull_request:
    branches: [candidate]
    paths:
      - 'src/integration/conversation-lab/**'
      - 'src/config/apps.generated.json'
      - 'src/config/apps.fallback.json'
      - 'src/config/platform-consumers.json'
      - 'src/config/sources.json'
      - 'src/config/release-wave.json'
      - 'src/config/ai-readiness.generated.json'
      - 'src/config/sync-report.json'
      - 'scripts/test-clb-e118-owner-s0-live.mjs'
      - '.github/workflows/clb-e118-owner-s0-release-gates.yml'
permissions:
  contents: read
jobs:
  signed-s0-ten-app-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify complete signed 0.9.2 B1 + separate owner S0 acceptance + protected teacher launcher
        run: node --test scripts/test-clb-e118-owner-s0-live.mjs
      - name: Verify exact 10-app GHRAB ecosystem with signed source, 11 platform consumers
        run: |
          node scripts/sync-platform-consumers.mjs --check
          node scripts/qa-ecosystem.mjs --require-source-verification
      - name: Verify actual LIVE 0.9.2 integrity, CSP, negative routes
        run: node --test scripts/test-clb-e114-live-092-strict.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run actual GARP 2.7 application regressions without overriding risk verdict
        run: npm run qa:garp27:regressions
