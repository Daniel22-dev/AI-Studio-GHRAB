name: CLB E118 actual MASTER 0.11.0 signature and isolated public release (NO DEPLOY)
on:
  pull_request:
    branches: [candidate]
    paths:
      - 'src/conversation-lab/**'
      - 'src/integration/conversation-lab/**'
      - 'src/config/apps.generated.json'
      - 'src/config/apps.fallback.json'
      - 'src/config/platform-consumers.json'
      - 'src/config/sources.json'
      - 'src/config/release-wave.json'
      - 'src/config/ai-readiness.generated.json'
      - 'src/config/sync-report.json'
      - 'scripts/test-clb-*.mjs'
      - 'scripts/lib/clb-master-*.mjs'
      - '.github/workflows/clb-e118-owner-s0-release-gates.yml'
permissions:
  contents: read
jobs:
  signed-s0-ten-app-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual 72-variant receipt, installed tree, guards and preserved legacy signature scope
        run: node --test scripts/test-clb-e118-owner-s0-live.mjs scripts/test-clb-master-received-owner-signature.mjs scripts/test-clb-master-staged-hold.mjs scripts/test-clb-master-teacher-gate.mjs scripts/test-clb-studio-portal-route.mjs
      - name: Verify ten-app ecosystem, signed source metadata and unchanged unrelated apps
        run: |
          node scripts/sync-platform-consumers.mjs --check
          node scripts/qa-ecosystem.mjs --require-source-verification
      - name: Verify actual public MASTER 0.11.0 HTTPS bytes, headers and negative routes
        run: node scripts/test-clb-master-live.mjs
      - name: Run actual GARP 2.7 application regressions without overriding risk verdict
        run: npm run qa:garp27:regressions
