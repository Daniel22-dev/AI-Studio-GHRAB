name: Conversation Lab E9.6 ten-app registry CANDIDATE (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/config/sources.json'
      - 'src/config/apps.fallback.json'
      - 'src/config/apps.generated.json'
      - 'src/config/platform-consumers.json'
      - 'src/config/ai-readiness.generated.json'
      - 'src/config/release-wave.json'
      - 'src/config/sync-report.json'
      - 'scripts/test-clb-e96-registry-candidate.mjs'
      - 'scripts/test-clb-e96-scoped-garp.mjs'
      - 'security/garp27/conversation-lab-standalone-release-profile.candidate.json'
      - '.github/workflows/clb-e96-catalog-candidate.yml'
permissions:
  contents: read
jobs:
  catalog-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check full ten-app config, CLB-01 policy and explicit PRELIVE hold
        run: node --test scripts/test-clb-e96-registry-candidate.mjs
      - name: Dry-run normal P5 platform-consumer sync inside temporary CI checkout (no commit or deploy)
        run: |
          node scripts/sync-platform-consumers.mjs
          node scripts/sync-platform-consumers.mjs --check
      - name: Verify source and GHRAB platform policies for ten-app candidate
        run: node scripts/qa-ecosystem.mjs --require-source-verification
      - name: Verify scoped GARP FOUNDATION vs deliberately deferred school-server LIVE is not falsified
        run: node --test scripts/test-clb-e96-scoped-garp.mjs
      - name: Verify E101 owner ES256 signed B1 receipt, E102 WebCrypto protected launch and signed CLB-01 access on exact PR head
        run: |
          node --test scripts/test-clb-e101-owner-content-release.mjs
          node --test scripts/test-clb-e102-runtime-owner-receipt.mjs
          node --test scripts/test-clb01-signed-access-promotion.mjs
      - name: Check candidate can launch protected CLB portal without affecting other nine
        run: node --test scripts/test-clb-studio-portal-route.mjs
