name: CLB exact vocabulary exception and tamper regressions (NO DEPLOY)
on:
  push:
    branches: ['feature/clb-teacher-same-origin-prelive-20261019']
  pull_request:
    branches: [candidate, main]
    paths:
      - 'security/garp25/**'
      - 'src/conversation-lab/**'
      - 'scripts/test-clb-secret-exceptions.mjs'
      - '.github/workflows/clb-secret-regressions.yml'
permissions:
  contents: read
jobs:
  source-and-deployed-byte-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reject source changes, deployment-only changes and private key material
        run: node --test scripts/test-clb-secret-exceptions.mjs
      - name: Run unchanged full source detection rules
        run: node security/garp25/tools/scan-source-secrets.mjs .
