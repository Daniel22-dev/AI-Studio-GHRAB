name: CLB immutable-source secret finding diagnosis (READ ONLY)
on:
  push:
    branches: ['feature/clb-teacher-same-origin-prelive-20261019']
    paths: ['.github/workflows/clb-secret-triage.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Emit rule names, exact source hashes and bounded assignment context for review only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const run=spawnSync(process.execPath,['security/garp25/tools/scan-source-secrets.mjs','.'],{encoding:'utf8',maxBuffer:8e6});
          const report=JSON.parse(run.stdout||run.stderr);
          console.log('SCANNER_STATUS='+report.status);
          console.log('FINDINGS='+JSON.stringify(report.findings));
          const scanner=fs.readFileSync('security/garp25/tools/secret-scan-common.mjs','utf8');
          const literal=scanner.match(/^const assignedQuoted = (\/.*\/gi);$/m);
          if(!literal)throw Error('No exact literal scanner regex');
          const re=new RegExp(literal[1].slice(1,-3),'gi');
          for(const item of report.findings){
            if(!item.path.startsWith('src/conversation-lab/')||item.rules.some(x=>x!=='assigned-secret-literal'&&x!=='assigned-secret-bare'))continue;
            const data=fs.readFileSync(item.path);const text=data.toString('utf8');
            const sha=crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');
            re.lastIndex=0;const matches=[...text.matchAll(re)].map(m=>({key:m[1],value:m[3].slice(0,120),length:m[3].length,line:1+text.slice(0,m.index).split('\n').length-1}));
            console.log('REVIEW_CANDIDATE='+JSON.stringify({path:item.path,blob:sha,rules:item.rules,matches}));
          }
          console.log('DIAGNOSIS_ONLY_NOT_A_SECURITY_PASS');
          JS
