name: Conversation Lab E9.1 Studio handoff PRELIVE (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/integration/conversation-lab/**'
      - 'src/config/access-policy.json'
      - 'src/config/access-config-bundle.json'
      - 'src/config/access-config-bundle.sig.json'
      - 'src/config/deployment.json'
      - 'src/config/deployment.school-server.json'
      - 'src/app/external/launcher.js'
      - 'src/app.js'
      - 'src/assets/apps/conversation-lab.svg'
      - 'src/integration/conversation-lab/catalog-proposal.json'
      - 'scripts/test-conversation-lab-hosting-handoff.mjs'
      - 'scripts/test-conversation-lab-owner-consent.mjs'
      - 'scripts/test-clb01-signed-access-promotion.mjs'
      - 'scripts/test-clb-studio-portal-route.mjs'
      - 'scripts/test-clb-e95-manifest-candidate.mjs'
      - 'scripts/test-conversation-lab-launcher.mjs'
      - 'scripts/test-maturita-external-launcher.mjs'
      - '.github/workflows/conversation-lab-e9-1-handoff.yml'
permissions:
  contents: read
jobs:
  check-e9-1-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce CLB portal protected teacher path and preserve the nine original routes
        run: node --test scripts/test-clb-studio-portal-route.mjs
      - name: Check Studio portal syntax
        run: node --check src/app.js
      - name: Check Studio protected launcher syntax
        run: node --check src/app/external/launcher.js
      - name: Verify owner GO and signed policy/manifest fail-closed admission
        run: node --test scripts/test-conversation-lab-owner-consent.mjs
      - name: Verify E9 teacher launcher, expired/untrained/forged policies
        run: node --test scripts/test-conversation-lab-launcher.mjs
      - name: Verify exact public manifest candidate and zero unauthorized Studio release
        run: node --test scripts/test-clb-e95-manifest-candidate.mjs
      - name: Verify signed CLB-01 ES256 bundle and nine unchanged apps
        run: node --test scripts/test-clb01-signed-access-promotion.mjs
      - name: Verify bundle freshness and deployment references
        run: node scripts/check-access-bundle-freshness.mjs --required
      - name: Check Cloudflare verified pilot handoff evidence
        run: node --test scripts/test-conversation-lab-hosting-handoff.mjs
      - name: Protect existing Maturita Desk entry
        run: node scripts/test-maturita-external-launcher.mjs
      - name: GARP PRELIVE must remain correctly fail closed
        run: node scripts/garp27/conversation-lab-enrollment.mjs
