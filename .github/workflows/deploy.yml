name: Sync, certify and deploy AI Studio GHRAB

# Compatibility markers for the historical repository self-audit:
# app-updated is handled only by .github/workflows/auto-patch-ingest.yml.
# The daily safety synchronisation also lives there: cron: "17 3 * * *".
# Production deployment must never ingest or persist an app update directly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ai-studio-pages
  cancel-in-progress: false

jobs:
  qa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify version and latest release logbook
        run: node scripts/verify-release-version-freshness.mjs --content-only
      - name: Verify deploy originates from Safe Promotion
        run: node scripts/verify-safe-promotion-origin.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify protected deployment branch
        run: node scripts/verify-github-deployment-governance.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify auto-patch workflow architecture
        run: node scripts/verify-auto-patch-workflow-architecture.mjs

      - name: Verify signed access bundle freshness
        run: npm run access:check:required
      - name: Verify committed runtime fallback before live synchronisation
        run: |
          npm run qa:fallback
          npm run test:runtime-fallback

      - name: Synchronise application manifests
        run: npm run sync
      - name: Format generated registry files
        run: npm run format:generated-json
      - name: Verify declared deployment release identities
        run: node scripts/verify-deployment-release-identities.mjs
      - name: Verify Platform 1.1.2 release-wave sources
        run: |
          npm run qa:ecosystem:verified
          node scripts/sync-platform-consumers.mjs --check
          node scripts/qa-ecosystem.mjs --require-source-verification

      - name: Refresh runtime fallback from all live-verified sources
        run: |
          npm run sync:fallback
          npm run qa:fallback
          npm run test:runtime-fallback

      - name: Verify immutable Core before formatting
        run: npm run verify:ai-core
      - name: Normalize source formatting
        run: npm run format
      - name: Verify immutable Core after formatting
        run: npm run verify:ai-core
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          GHRAB_VISUAL_ATTEMPTS: 3
          GHRAB_VISUAL_SCREENSHOT_ATTEMPTS: 3
      # The earlier reporter-only build was discarded by qa:release. Keep the
      # full reporter browser regression, now on the QA-built dist, with a
      # fail-closed before/after artifact digest and fresh reporter evidence.
      - name: Verify reporter against QA-certified build (P2)
        run: node scripts/p2-reporter-build-parity.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      - name: Run GARP 2.7 FOUNDATION gate
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run qa:garp27:foundation
      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci
      - name: Prepare production deployment artifact
        run: npm run prepare:deployment-dist

      - name: Create LIVE Studio GARP release assurance
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_RELEASE_STAGE: LIVE-PUBLIC-PAGES
        run: npm run prepare:studio-release
      - name: Verify LIVE Studio release assurance chain
        run: npm run verify:studio-release

      # Bind the exact public bytes to the commit tested in this SAME qa-build job.
      # This audit evidence is private to Actions; it is NOT added to public dist.
      - name: Snapshot release files for live byte-parity acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const names = ['index.html','build-info.json','sw.js'];
          if (!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_SHA || '')) throw Error('invalid source SHA');
          const files = Object.fromEntries(names.map(name => {
            const bytes = fs.readFileSync('dist/' + name);
            if (!bytes.length) throw Error('empty deployed asset: ' + name);
            return [name, crypto.createHash('sha256').update(bytes).digest('hex')];
          }));
          fs.mkdirSync('live-parity-evidence', {recursive: true});
          fs.writeFileSync('live-parity-evidence/snapshot.json', JSON.stringify({
            schema: 'ghrab-live-byte-parity-v1', sourceCommit:process.env.EXPECTED_SHA, files
          },null,2)+'\n', {flag:'wx'});
          NODE
      - name: Upload immutable expected public byte digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-parity-expected-${{ github.sha }}
          path: live-parity-evidence/snapshot.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  qa-diagnostics:
    if: always()
    needs: qa-build
    runs-on: ubuntu-latest
    steps:
      - name: Download QA evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Print compact QA diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'qa-results/qa-report.json';
          if (!fs.existsSync(reportPath)) {
            console.error('QA report missing.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          console.log(`VERDICT ${report.verdict}`);
          for (const gate of report.gates || []) {
            console.log(`GATE ${gate.name}: ${gate.status} findings=${(gate.findings || []).length}`);
          }
          for (const item of report.blockerAndMajor || []) {
            console.log(`FINDING ${item.severity} ${item.gate} ${item.code}: ${item.message} | evidence=${item.evidence || ''}`);
          }
          NODE

  deploy:
    needs: qa-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  post-deployment-live-parity:
    # An actual independent GitHub runner, after successful Pages deployment.
    # This is a strict audit gate for the run; it never silently changes main.
    needs: [qa-build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download exact QA-built public digest snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: live-parity-expected-${{ github.sha }}
          path: live-parity-evidence
      - name: Compare public HTTP(S) bytes with deployed QA artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          LIVE_BASE_URL: https://daniel22-dev.github.io/AI-Studio-GHRAB/
        run: |
          node <<'NODE'
          const fs = await import('node:fs');
          const crypto = await import('node:crypto');
          const expected = JSON.parse(fs.readFileSync('live-parity-evidence/snapshot.json','utf8'));
          const sha = process.env.EXPECTED_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha) || expected.schema !== 'ghrab-live-byte-parity-v1' ||
              expected.sourceCommit !== sha) throw Error('snapshot source SHA mismatch');
          const names = ['index.html','build-info.json','sw.js'];
          if (Object.keys(expected.files).sort().join(',') !== [...names].sort().join(',') ||
              names.some(n => !/^[a-f0-9]{64}$/.test(expected.files[n] || '')))
            throw Error('missing/invalid expected asset digests');
          const results = [];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let ok = false;
          for (let attempt=1;attempt<=12;attempt++) {
            results.length=0;
            for (const name of names) {
              const url = new URL(name,process.env.LIVE_BASE_URL);
              url.searchParams.set('_ghrab_release_sha',sha);
              const item = {name,attempt};
              try {
                const response = await fetch(url,{redirect:'error',signal:AbortSignal.timeout(12000),headers:{'Cache-Control':'no-cache'}});
                item.httpStatus=response.status;
                item.contentType=response.headers.get('content-type');
                if (!response.ok) throw Error('HTTP '+response.status);
                const bytes=Buffer.from(await response.arrayBuffer());
                item.bytes=bytes.length;
                item.digest=crypto.createHash('sha256').update(bytes).digest('hex');
                item.match=item.digest===expected.files[name];
              } catch (e) {item.error=String(e);item.match=false}
              results.push(item);
            }
            if(results.every(x=>x.match)){ok=true;break}
            if(attempt<12)await sleep(10000);
          }
          const report={schema:'ghrab-live-http-parity-v1',sourceCommit:sha,
            checkedAt:new Date().toISOString(),status:ok?'PASS':'FAIL',checks:results};
          fs.writeFileSync('live-parity-evidence/live-http-result.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if(!ok)process.exitCode=1;
          NODE
      - name: Preserve independent HTTP acceptance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-http-acceptance-${{ github.sha }}
          path: live-parity-evidence/live-http-result.json
          if-no-files-found: warn
          retention-days: 90
