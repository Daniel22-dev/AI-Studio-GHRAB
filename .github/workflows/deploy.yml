name: Sync, certify and deploy AI Studio GHRAB

# Compatibility markers for the historical repository self-audit:
# app-updated is handled only by .github/workflows/auto-patch-ingest.yml.
# The daily safety synchronisation also lives there: cron: "17 3 * * *".
# Production deployment must never ingest or persist an app update directly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-studio-pages
  cancel-in-progress: false

jobs:
  qa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify deploy originates from Safe Promotion
        run: node scripts/verify-safe-promotion-origin.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify protected deployment branch
        run: node scripts/verify-github-deployment-governance.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify auto-patch workflow architecture
        run: node scripts/verify-auto-patch-workflow-architecture.mjs

      - name: Verify signed access bundle freshness
        run: npm run access:check:required

      - name: Synchronise application manifests
        run: npm run sync
      - name: Format generated registry files
        run: npm run format:generated-json
      - name: Verify declared deployment release identities
        run: node scripts/verify-deployment-release-identities.mjs
      - name: Verify Platform 1.1.2 release-wave sources
        run: |
          npm run qa:ecosystem:verified
          node scripts/sync-platform-consumers.mjs --check
          node scripts/qa-ecosystem.mjs --require-source-verification

      - name: Verify immutable Core before formatting
        run: npm run verify:ai-core
      - name: Normalize source formatting
        run: npm run format
      - name: Verify immutable Core after formatting
        run: npm run verify:ai-core
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Build application for reporter regression
        run: npm run build
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          GHRAB_VISUAL_ATTEMPTS: 3
          GHRAB_VISUAL_SCREENSHOT_ATTEMPTS: 3
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  qa-diagnostics:
    if: always()
    needs: qa-build
    runs-on: ubuntu-latest
    steps:
      - name: Download QA evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Print compact QA diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'qa-results/qa-report.json';
          if (!fs.existsSync(reportPath)) {
            console.error('QA report missing.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          console.log(`VERDICT ${report.verdict}`);
          for (const gate of report.gates || []) {
            console.log(`GATE ${gate.name}: ${gate.status} findings=${(gate.findings || []).length}`);
          }
          for (const item of report.blockerAndMajor || []) {
            console.log(`FINDING ${item.severity} ${item.gate} ${item.code}: ${item.message} | evidence=${item.evidence || ''}`);
          }
          NODE

  deploy:
    needs: qa-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
