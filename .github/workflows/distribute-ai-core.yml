name: Distribute GHRAB AI Core
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without repository dispatch
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Verify immutable Core release
        run: node scripts/verify-ai-core.mjs
      - name: Preview distribution
        if: ${{ inputs.dry_run }}
        run: node scripts/dispatch-ai-core.mjs --dry-run
      - name: Dispatch verified release
        if: ${{ !inputs.dry_run }}
        env:
          GHRAB_CORE_SYNC_TOKEN: ${{ secrets.GHRAB_CORE_SYNC_TOKEN }}
        run: node scripts/dispatch-ai-core.mjs
