name: E7 Studio exact LUDUS wave rebaseline review
on:
  push:
    branches: [feature/e7-ludus-113-explicit-wave-rebaseline-20261026]
    paths: [.github/workflows/e7-ludus-wave-review-generate.yml]
permissions:
  contents: read
jobs:
  derive-reviewed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STUDIO_BASE: 82fbf6bd112e0983729a2fff96d363cea59ff937
      REVIEW_BRANCH: feature/e7-ludus-113-explicit-wave-rebaseline-20261026
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/e7-ludus-113-explicit-wave-rebaseline-20261026
          fetch-depth: 0
          token: ${{ secrets.SAFE_PROMOTION_TOKEN }}
      - name: Verify pinned review source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$STUDIO_BASE^{commit}"
          git merge-base --is-ancestor "$STUDIO_BASE" HEAD
          test "$(node -p "require('./package.json').version")" = "0.21.257"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Confirm strict double 1.1.3 pins, source identity and live registry
        run: |
          node --test scripts/test-release-wave-platform-policy.mjs
          npm run access:check:required
          npm run sync
          npm run format:generated-json
          node scripts/verify-deployment-release-identities.mjs
          npm run qa:ecosystem:verified
          npm run sync:fallback
          npm run qa:fallback
      - name: Bind exact verified E7 change to Studio patch release
        run: npm run release:patch -- --auto-patch
      - name: Recreate synced Studio release metadata
        run: |
          npm run sync
          npm run format:generated-json
          node scripts/verify-deployment-release-identities.mjs
          npm run qa:ecosystem:verified
          npm run sync:fallback
          npm run qa:fallback
      - name: Run policy and fallback regression tests
        run: |
          node --test scripts/test-release-wave-platform-policy.mjs
          npm run test:release-promotion
          npm run test:runtime-fallback
          npm run test:auto-patch-idempotence
          npm run test:release-identity-timing
          node scripts/verify-release-version-freshness.mjs --content-only
      - name: Commit only source-derived artifacts on review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.21.258"
          git add -u
          git diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          test -s "$RUNNER_TEMP/staged.txt"
          if grep -Ev '^(src/config/|src/index.html$|src/manifest.webmanifest$|src/tests/error-reporter-adapter.js$|package.json$|package-lock.json$|ghrab-platform.consumer.json$|reporter-test.config.json$|qa/qa-manifest.json$|README.md$|BEZPECNOST.md$|AUTOMATIZACE-GITHUB.md$|RELEASE-CHECKLIST.md$|ARCHITEKTURA.md$|POSTUP-NAHRANI.md$|NAHRANI-NA-GITHUB.md$)' "$RUNNER_TEMP/staged.txt"; then
            echo "::error::Unexpected generated file, fail closed"
            exit 1
          fi
          git fetch --no-tags origin "$REVIEW_BRANCH"
          test "$(git rev-parse "origin/$REVIEW_BRANCH")" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(studio): source-verified E7 LUDUS registry 0.21.258"
          npm run verify:release-version
          git push origin "HEAD:$REVIEW_BRANCH"
