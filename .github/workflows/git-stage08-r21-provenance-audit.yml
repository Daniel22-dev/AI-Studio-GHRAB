name: GIT R29 AST-core isolated preproduction admission (NO DEPLOY)
on:
  push:
    branches: [audit/git-stage08-r21-provenance-20261103]
permissions:
  contents: read
jobs:
  preproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source from isolated GIT QA branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: 5813206c7dab2d01eb8c9be793fde73300feccbd
          fetch-depth: 0
          persist-credentials: false
          path: audited
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies only
        working-directory: audited
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Full original build, vendor source and quality parity
        working-directory: audited
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5813206c7dab2d01eb8c9be793fde73300feccbd"
          npm run build
          node scripts/qa-p3-quality.mjs
          node scripts/check-csp.mjs
          npm run check:stage08-groups
          npm run check:stage08-results
          test "$(git rev-parse HEAD)" = "5813206c7dab2d01eb8c9be793fde73300feccbd"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Show current quality and immutable vendor checks
        if: always()
        working-directory: audited
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const f='dist/quality-report.json';
          if(!fs.existsSync(f)){console.log('NO P3 QUALITY REPORT');process.exit(0)}
          const j=JSON.parse(fs.readFileSync(f,'utf8'));
          const bad=j.checks?.filter(x=>!x.ok)||[];
          console.log(JSON.stringify({metrics:j.metrics?.distBytes||j.metrics,
            status:j.status,failed:bad.map(x=>({id:x.id,detail:x.detail}))},null,2));
          NODE
          echo "SOURCE HEAD=$(git rev-parse HEAD)"
