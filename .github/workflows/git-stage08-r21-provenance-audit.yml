name: GIT R27 emitted asset size diagnosis (READ ONLY)
on:
  push:
    branches: [audit/git-stage08-r21-provenance-20261103]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: 27cd0fe049a415f431cfd94b4fce5401a11f54ea
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce original exact-SHA build
        working-directory: source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run build
      - name: Compare original PNG with emitted asset and candidate encoder
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { PNG } from 'pngjs';
          const files=[
            ['icons/icon-512.png','public/icons/icon-512.png'],
            ['icons/icon-maskable-512.png','public/icons/icon-maskable-512.png'],
            ['icons/icon-192.png','public/icons/icon-192.png'],
            ['icons/apple-touch-icon.png','public/icons/apple-touch-icon.png'],
            ['assets/brand/school-logo.png','public/assets/brand/school-logo.png'],
            ['vendor/acorn.js',''],
            ['features/generator-assistant.js',''],
            ['features/stage09-material.js',''],
            ['features/stage09-save-to-studio-local.js',''],
            ['manual/navigation-context.js',''],
            ['manual/pdf-download.js','']
          ];
          for(const [name,originalFile] of files){
            const out=fs.readFileSync('dist/'+name);
            const row={file:name,out:out.length};
            if(originalFile){const before=fs.readFileSync(originalFile);row.original=before.length;row.saving=before.length-out.length;}
            if(name.includes('school-logo')){
              const src=PNG.sync.read(fs.readFileSync(originalFile));
              const c=PNG.sync.write({width:src.width,height:src.height,data:src.data},
                {inputHasAlpha:true,colorType:2,filterType:0,deflateStrategy:0,deflateLevel:9});
              row.candidate=c.length;
              row.firstData=fs.readFileSync(originalFile).indexOf(Buffer.from('IDAT'));
              row.transparency=Array.from(src.data).filter((_,i)=>i%4===3).every(x=>x===255);
              const dest=PNG.sync.read(out);
              row.equalPixels=Buffer.from(src.data).equals(Buffer.from(dest.data));
            }
            console.log(JSON.stringify(row));
          }
          NODE
          test "$(git rev-parse HEAD)" = "27cd0fe049a415f431cfd94b4fce5401a11f54ea"
          test -z "$(git status --porcelain --untracked-files=no)"
