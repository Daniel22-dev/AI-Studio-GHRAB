name: GIT R25 original PNG metadata check (READ ONLY)
on:
  push:
    branches:
      - audit/git-stage08-r21-provenance-20261103
permissions:
  contents: read
jobs:
  png-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: ca660f34c40e7203c29d3120bb10b9c29ec0837e
          persist-credentials: false
          path: src
      - name: Check source image ancillary chunks
        working-directory: src
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paths=['public/icons/icon-512.png','public/icons/icon-maskable-512.png',
            'public/icons/icon-192.png','public/icons/apple-touch-icon.png',
            'public/assets/brand/school-logo.png'];
          for(const path of paths){
            const b=fs.readFileSync(path);
            if(b.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw Error('Not PNG');
            let off=8,parts=[];
            while(off+12<=b.length){
              const n=b.readUInt32BE(off),type=b.toString('ascii',off+4,off+8);
              parts.push({type,n});
              off+=12+n;
              if(type==='IEND')break;
            }
            console.log(JSON.stringify({path,byteLength:b.length,
              types:parts.map(x=>x.type),ancillary:parts.filter(x=>/^(iCCP|gAMA|sRGB|cHRM|sBIT|eXIf|tEXt|iTXt|zTXt|pHYs)$/.test(x.type))}));
          }
          NODE
          test "$(git rev-parse HEAD)" = "ca660f34c40e7203c29d3120bb10b9c29ec0837e"
