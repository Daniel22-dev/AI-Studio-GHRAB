name: GIT R29 full P5 and teacher-student journeys (EXTERNAL AUDIT ONLY)
on:
  push:
    branches: [audit/git-stage08-r21-provenance-20261103]
permissions:
  contents: read
jobs:
  original-p5-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Immutable checkout of GIT candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: 5813206c7dab2d01eb8c9be793fde73300feccbd
          fetch-depth: 0
          persist-credentials: false
          path: git-reviewed
      - name: Pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install original locked tools and real Chromium
        working-directory: git-reviewed
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Verify original immutable source SHA
        working-directory: git-reviewed
        run: |
          test "$(git rev-parse HEAD)" = "5813206c7dab2d01eb8c9be793fde73300feccbd"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run full original GIT P5 without cross-repository event SHA
        working-directory: git-reviewed
        shell: bash
        env:
          GARP27_EXTERNAL_TRUST_SHA256: ec7aa8abbc4a4a915627f569eaa69b3a8da56155565b955814263bead2061006
        run: |
          set -euo pipefail
          env -u GITHUB_SHA npm run qa:p5:ci
          test "$(git rev-parse HEAD)" = "5813206c7dab2d01eb8c9be793fde73300feccbd"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Report immutable source on success or failure
        if: always()
        working-directory: git-reviewed
        run: |
          echo "Expected audited GIT SHA: 5813206c7dab2d01eb8c9be793fde73300feccbd"
          echo "Actual audited GIT SHA: $(git rev-parse HEAD)"
          git status --porcelain --untracked-files=no | head -15
  original-journey-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Immutable read-only GIT source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: 5813206c7dab2d01eb8c9be793fde73300feccbd
          fetch-depth: 0
          persist-credentials: false
          path: git-reviewed
      - name: Setup pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Pinned dependencies and browser
        working-directory: git-reviewed
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Install declared Python audit tools into isolated venv
        working-directory: git-reviewed
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/git-r29-audit"
          "$RUNNER_TEMP/git-r29-audit/bin/pip" install --disable-pip-version-check -r audit/requirements-audit.txt
      - name: Build exact reviewed source and run all original teacher/student Journeys
        working-directory: git-reviewed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5813206c7dab2d01eb8c9be793fde73300feccbd"
          npm run build
          rm -rf audit/evidence
          mkdir -p audit/evidence
          "$RUNNER_TEMP/git-r29-audit/bin/python" audit/run_audit.py \
            --suite journey_suite --suite state_transition_suite --suite config_extra_suite \
            --suite feature_suite --suite integration_suite --suite identity_suite --suite wizard_suite
          test "$(git rev-parse HEAD)" = "5813206c7dab2d01eb8c9be793fde73300feccbd"
