name: GIT R26 lossless quality admission (AUDIT ONLY, NO DEPLOY)
on:
  push:
    branches:
      - audit/git-stage08-r21-provenance-20261103
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable GIT release draft
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: 27cd0fe049a415f431cfd94b4fce5401a11f54ea
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Install pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies and original build
        working-directory: source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          test "$(git rev-parse HEAD)" = "27cd0fe049a415f431cfd94b4fce5401a11f54ea"
          npm run build
          test "$(git rev-parse HEAD)" = "27cd0fe049a415f431cfd94b4fce5401a11f54ea"
      - name: Run original P3 dist size, quality and Stage08 safety checks
        working-directory: source
        run: |
          node scripts/qa-p3-quality.mjs
          npm run check:stage08-groups
          npm run check:stage08-results
          npm run test:stage09
          node scripts/check-csp.mjs
      - name: Independently confirm five image RGB(A) pixel and ICC byte identities
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {PNG} from 'pngjs';
          const files=['icons/icon-512.png','icons/icon-maskable-512.png',
            'icons/icon-192.png','icons/apple-touch-icon.png','assets/brand/school-logo.png'];
          let totalSaved=0;
          const icc=bytes=>{
            let at=8,out=[];
            while(at+12<=bytes.length){
              const len=bytes.readUInt32BE(at),name=bytes.toString('ascii',at+4,at+8);
              if(name==='iCCP')out.push(bytes.subarray(at,at+len+12));
              at+=len+12;if(name==='IEND')break;
            }
            return out;
          };
          for(const file of files){
            const src=fs.readFileSync('public/'+file),dst=fs.readFileSync('dist/'+file);
            const a=PNG.sync.read(src),b=PNG.sync.read(dst);
            assert.equal(a.width,b.width);assert.equal(a.height,b.height);
            assert.ok(Buffer.from(a.data).equals(Buffer.from(b.data)),file+' pixel mismatch');
            assert.deepEqual(icc(src),icc(dst),file+' ICC profile mismatch');
            assert.ok(dst.length<src.length,file+' failed to shrink');
            totalSaved+=src.length-dst.length;
          }
          console.log(JSON.stringify({status:'PASS',pixelAndICCParity:files.length,bytesSaved:totalSaved}));
          NODE
          test "$(git rev-parse HEAD)" = "27cd0fe049a415f431cfd94b4fce5401a11f54ea"
          test -z "$(git status --porcelain --untracked-files=no)"
