name: GIT Stage08 R22 dist size audit (SYNTHETIC ONLY, NO DEPLOY)
on:
  push:
    branches:
      - audit/git-stage08-r21-provenance-20261103
permissions:
  contents: read
jobs:
  distribution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact GIT source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: ca660f34c40e7203c29d3120bb10b9c29ec0837e
          fetch-depth: 0
          persist-credentials: false
          path: inspected-git
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install only locked dependencies
        working-directory: inspected-git
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build exact immutable source; never deploy
        working-directory: inspected-git
        run: |
          test "$(git rev-parse HEAD)" = "ca660f34c40e7203c29d3120bb10b9c29ec0837e"
          npm run build
          test "$(git rev-parse HEAD)" = "ca660f34c40e7203c29d3120bb10b9c29ec0837e"
      - name: Print size offenders and whitespace data (read only)
        working-directory: inspected-git
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='dist',out=[];
          function walk(dir){
            for(const item of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,item.name);
              if(item.isDirectory())walk(p);
              else if(item.isFile())out.push({file:p.slice(root.length+1).replaceAll('\\','/'),bytes:fs.statSync(p).size});
            }
          }
          walk(root);
          out.sort((a,b)=>b.bytes-a.bytes);
          const excluded=new Set(['quality-report.json','config/quality-manifest.json']);
          const actual=out.filter(x=>!excluded.has(x.file));
          const sum=x=>x.reduce((n,r)=>n+r.bytes,0);
          const entry=fs.readFileSync('dist/index.html','utf8');
          const manual=fs.readFileSync('dist/manual/index.html','utf8');
          const whitespace=txt=>({
            bytes:Buffer.byteLength(txt),
            lines:txt.split('\n').length,
            indentationBytes:(txt.match(/^[ \t]+/gm)||[]).reduce((n,s)=>n+s.length,0),
            intertagWhitespaceBytes:(txt.match(/>\s+</g)||[]).reduce((n,s)=>n+s.length-2,0)
          });
          const optional=out.filter(x=>x.file.startsWith('features/')||x.file.startsWith('manual/')||x.file.startsWith('access/'));
          console.log(JSON.stringify({
            schema:'ghrab-git-r22-dist-readonly-v1',
            source:'ca660f34c40e7203c29d3120bb10b9c29ec0837e',
            distBytes:sum(actual),
            budget:2806000,
            overBy:sum(actual)-2806000,
            topFiles:out.slice(0,45),
            options:optional.slice(0,30),
            entry:whitespace(entry),
            manual:whitespace(manual)
          },null,2));
          NODE
