name: My Groups least-privilege consumers (NO DEPLOY)
on:
  push:
    branches:
      - security/groups-consumer-facade-20261027
permissions:
  contents: read
jobs:
  consumer-access:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate exact revision and source tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/groups/verified-client.js
          node --check scripts/test-groups-crossapp-browser.mjs
          npm run test:groups
      - name: Install pinned Chromium and dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Cross-consumer capability checks with synthetic accounts
        run: |
          node scripts/test-groups-crossapp-browser.mjs
          node scripts/test-groups-verified-client-browser.mjs
