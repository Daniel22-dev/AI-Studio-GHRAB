name: My Groups guarded UI isolated QA (NO DEPLOY)
on:
  push:
    branches:
      - security/groups-ui-access-gate-20261027

permissions:
  contents: read

jobs:
  groups-source-regressions:
    name: groups-access-guard-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact source and run groups access regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/groups/group-service.js
          node --check src/groups/groups.js
          node --check scripts/test-groups.mjs
          node --check scripts/test-groups-access-browser.mjs
          node --check scripts/test-groups-verified-client-browser.mjs
          node --check scripts/test-groups-crossapp-browser.mjs
          node --check src/groups/verified-client.js
          npm run test:groups
      - name: Install pinned Chromium test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Verify real browser render, lock and account switch
        run: |
          node scripts/test-groups-access-browser.mjs
          node scripts/test-groups-verified-client-browser.mjs
          node scripts/test-groups-crossapp-browser.mjs
