name: MOJE SKUPINY v2 real external consumers pinned SHA (NO DEPLOY)
on:
  push:
    branches:
      - test/groups-v2-real-consumers-20261028
permissions:
  contents: read
jobs:
  real-crossrepo-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Studio HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout SORTIO Draft PR46 pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/SORTIO
          ref: bd4581265f72c51904754bd8299dd419c77717b6
          path: external/sortio
          persist-credentials: false
      - name: Checkout Hodnotitel Draft PR53 pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/Hodnotitel-maturitnich-slohu
          ref: 8211c730b4fd48e8af3e99c13b1d7ec1765ca485
          path: external/essay
          persist-credentials: false
      - name: Checkout Lesson Hub Draft PR24 pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/lesson-hub
          ref: f7355364c7604f7c16887a4b6d6a665bc7d9c475
          path: external/lesson
          persist-credentials: false
      - name: Checkout GIT Draft PR139 pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Daniel22-dev/generator-testu
          ref: a3fd61885552c03d12b83c3a8a16ec8af4a9e762
          path: external/git
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify exact five code states, no mutable branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C external/sortio rev-parse HEAD)" = "bd4581265f72c51904754bd8299dd419c77717b6"
          test "$(git -C external/essay rev-parse HEAD)" = "8211c730b4fd48e8af3e99c13b1d7ec1765ca485"
          test "$(git -C external/lesson rev-parse HEAD)" = "f7355364c7604f7c16887a4b6d6a665bc7d9c475"
          test "$(git -C external/git rev-parse HEAD)" = "a3fd61885552c03d12b83c3a8a16ec8af4a9e762"
          node --check scripts/test-groups-real-external-consumers.mjs
          node --check external/sortio/src/lazy/central-groups.js
          node --check external/essay/src/js/26-central-groups.js
          node --check external/lesson/src/integration/centralGroupsClient.js
          node --check external/git/src/features/central-groups.js
          node --check src/groups/group-service.js
          node --check scripts/test-groups.mjs
          npm run test:groups
      - name: Install pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Exercise exact actual external consumers against Studio v2
        run: node scripts/test-groups-real-external-consumers.mjs
