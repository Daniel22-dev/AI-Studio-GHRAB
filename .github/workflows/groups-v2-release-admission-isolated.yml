name: My Groups v2 0.21.260 isolated release admission (NO DEPLOY)
on:
  push:
    branches:
      - preprod/groups-v2-0.21.260-admission-20261028

permissions:
  contents: read

jobs:
  release-governance:
    name: exact-sha-version-logbook-and-groups
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify immutable branch SHA and removed old workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p 'require("./package.json").version')" = "0.21.260"
          test ! -e .github/workflows/groups-ui-access-preprod.yml
          test ! -e .github/workflows/groups-v2-combined-preprod.yml
          test ! -e .github/workflows/groups-v2-real-consumers-preprod.yml
      - name: Verify release version and logbook governance
        run: |
          node --test scripts/test-changelog-policy.mjs
          npm run verify:release-version
      - name: Verify groups and migration negative cases
        run: |
          node --check src/groups/group-service.js
          node --check src/groups/groups.js
          node --check src/groups/legacy-migration.js
          node --check src/groups/verified-client.js
          npm run test:groups
          node scripts/test-groups-legacy-migration.mjs

  isolated-full-garp-p5:
    needs: release-governance
    name: full-garp27-p5-source-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Run actual full Studio P5 and GARP without publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export GHRAB_SOURCE_COMMIT="$GITHUB_SHA"
          export GHRAB_SOURCE_REPOSITORY="$GITHUB_REPOSITORY"
          export GHRAB_RELEASE_STAGE="PREP-VALIDATION"
          npm run format:check
          npm run qa:garp27:foundation
          npm run qa:p5:ci
          npm run test:studio-ux
      - name: Preserve nonproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: groups-v2-preprod-evidence
          path: |
            dist/qa-p5-*.json
            dist/quality-report.json
            qa-results/release-current
          if-no-files-found: warn
          retention-days: 14
