name: Manual PDF content and glyph regression

on:
  workflow_dispatch:
  pull_request:
    branches: [candidate]
    paths:
      - "src/manualy/pdf-export.js"
      - "scripts/test-manual-pdf.mjs"
      - ".github/workflows/manual-pdf-qa.yml"
  push:
    branches: [candidate]
    paths:
      - "src/manualy/pdf-export.js"
      - "scripts/test-manual-pdf.mjs"
      - ".github/workflows/manual-pdf-qa.yml"

permissions:
  contents: read

concurrency:
  group: manual-pdf-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Verify exported PDF accessibility and full content
        run: npm run test:manual-pdf
