name: Legacy P4 entrypoint (delegates to P5 R2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Synchronise application manifests
        run: npm run sync
      - name: Format generated registry files
        run: npm run format:generated-json
      - name: Verify live release-wave sources and auto-promotion eligibility
        run: npm run qa:ecosystem:verified
      - name: Apply verified patch auto-promotions to release wave
        run: node scripts/apply-auto-promotions.mjs qa-results/release-promotion-report.json src/config/release-wave.json
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run current P5 R2 gate
        run: npm run qa:p5:ci
