name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [main]

concurrency:
  group: p5-r2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/candidate' }}

permissions:
  contents: read

jobs:
  candidate-to-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce Safe Promotion topology
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_BASE" != "main" ] || [ "$PR_HEAD" != "candidate" ]; then
              echo "::error::candidate-to-main requires candidate -> main; got ${PR_HEAD:-<empty>} -> ${PR_BASE:-<empty>}."
              exit 1
            fi
            echo "candidate-to-main verified: candidate -> main."
            exit 0
          fi

          if [ "$REF_NAME" != "candidate" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::candidate-to-main may run only for candidate/main outside PR context; got ${REF_NAME:-<empty>}."
            exit 1
          fi
          echo "candidate-to-main context emitted for ${REF_NAME}."

  p5-release-gate:
    needs: candidate-to-main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enforce canonical PR source
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$PR_BASE" != "main" ] || [ "$PR_HEAD" != "candidate" ]; then
            echo "::error::Safe Promotion requires candidate -> main; got ${PR_HEAD:-<empty>} -> ${PR_BASE:-<empty>}."
            exit 1
          fi
          echo "Safe Promotion topology verified: candidate -> main."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Enforce release version freshness
        run: npm run verify:release-version
      - name: Synchronise application manifests
        run: npm run sync
      - name: Format generated registry files
        run: npm run format:generated-json
      - name: Verify declared deployment release identities
        run: node scripts/verify-deployment-release-identities.mjs
      - name: Verify committed release-wave against live sources
        run: node scripts/sync-platform-consumers.mjs --check && node scripts/qa-ecosystem.mjs --require-source-verification
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run P5 R2 release gate
        run: npm run qa:p5:ci
      - name: Create Studio GARP release assurance
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_RELEASE_STAGE: PREP-VALIDATION
        run: npm run prepare:studio-release
      - name: Verify Studio release assurance chain
        run: npm run verify:studio-release
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p5-r2-${{ github.sha }}
          path: |
            dist/qa-p5-*.json
            dist/qa-p3-browser-report.json
            dist/quality-report.json
            dist/studio-manifest.json
            dist/release-integrity.json
            dist/sbom.cdx.json
            dist/build-provenance.json
            dist/security-evidence-manifest.json
            qa-results/release-current
