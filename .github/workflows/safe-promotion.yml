name: Safe Promotion controller

on:
  workflow_run:
    workflows: ["P5 R2 pre-production release gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: safe-promotion-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify candidate head and open or reuse promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SAFE_PROMOTION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing SAFE_PROMOTION_TOKEN. Promotion is fail-closed."
            exit 1
          fi
          remote_candidate="$(gh api "repos/${REPOSITORY}/git/ref/heads/candidate" --jq '.object.sha')"
          if [ "$remote_candidate" != "$CHECKED_SHA" ]; then
            echo "Candidate advanced after this P5 run; stale GREEN ignored."
            exit 0
          fi
          changed_files="$(gh api "repos/${REPOSITORY}/compare/main...candidate" --jq '.files | length')"
          if [ "$changed_files" = "0" ]; then
            echo "Candidate has no delta against main; safe NO-OP."
            exit 0
          fi
          existing="$(gh pr list --repo "$REPOSITORY" --state open --base main --head candidate --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Promotion PR #${existing} already exists."
            exit 0
          fi
          gh pr create --repo "$REPOSITORY" --base main --head candidate \
            --title "chore: safe promotion ${CHECKED_SHA:0:12}" \
            --body "Automated Safe Promotion from durable candidate after GREEN candidate P5. Candidate SHA: ${CHECKED_SHA}."

  merge-promotion-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge only verified candidate to protected main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SAFE_PROMOTION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing SAFE_PROMOTION_TOKEN. Merge blocked."
            exit 1
          fi
          pr_number="$(gh api "repos/${REPOSITORY}/commits/${CHECKED_SHA}/pulls" --jq '[.[] | select(.state == "open" and .base.ref == "main" and .head.ref == "candidate")][0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "No canonical candidate -> main PR for this GREEN run; safe NO-OP."
            exit 0
          fi
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [ "$(jq -r '.state' <<<"$pr_json")" != "open" ] || [ "$(jq -r '.draft' <<<"$pr_json")" != "false" ] || [ "$(jq -r '.base.ref' <<<"$pr_json")" != "main" ] || [ "$(jq -r '.head.ref' <<<"$pr_json")" != "candidate" ]; then
            echo "PR #${pr_number} is not canonical; safe NO-OP."
            exit 0
          fi
          if [ "$head_sha" != "$CHECKED_SHA" ]; then
            echo "PR head moved; stale GREEN ignored."
            exit 0
          fi
          remote_candidate="$(gh api "repos/${REPOSITORY}/git/ref/heads/candidate" --jq '.object.sha')"
          if [ "$remote_candidate" != "$CHECKED_SHA" ]; then
            echo "Candidate moved; stale GREEN ignored."
            exit 0
          fi
          branch_json="$(gh api "repos/${REPOSITORY}/branches/main")"
          if [ "$(jq -r '.protected' <<<"$branch_json")" != "true" ]; then
            echo "::error::main is not protected."
            exit 1
          fi
          if ! jq -e '.protection.required_status_checks.contexts // [] | index("p5-release-gate") != null' <<<"$branch_json" >/dev/null; then
            echo "::error::main does not require p5-release-gate."
            exit 1
          fi
          if [ "$(jq -r '.protection.required_status_checks.enforcement_level // "off"' <<<"$branch_json")" != "everyone" ]; then
            echo "::error::main protection allows bypass."
            exit 1
          fi
          checks_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${REPOSITORY}/commits/${CHECKED_SHA}/check-runs")"
          if ! jq -e '[.check_runs[] | select(.name == "p5-release-gate" and .conclusion == "success")] | length > 0' <<<"$checks_json" >/dev/null; then
            echo "::error::Required p5-release-gate is not GREEN."
            exit 1
          fi
          result="$(gh api --method PUT "repos/${REPOSITORY}/pulls/${pr_number}/merge" -f sha="$CHECKED_SHA" -f merge_method='merge')"
          if [ "$(jq -r '.merged' <<<"$result")" != "true" ]; then
            echo "::error::GitHub refused merge."
            exit 1
          fi
          merge_sha="$(jq -r '.sha' <<<"$result")"
          gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/candidate" -f sha="$merge_sha" -F force=false >/dev/null
          echo "Safe Promotion merged PR #${pr_number} and fast-forwarded candidate to ${merge_sha}."
