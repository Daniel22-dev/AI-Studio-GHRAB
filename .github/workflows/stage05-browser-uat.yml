name: Stage05 real-consumer browser UAT - NO DEPLOY
on:
  pull_request:
    branches: [candidate]
    paths:
      - 'tests/stage05/**'
      - 'src/material-flow/**'
      - 'src/bridge/studio-bridge.js'
      - 'src/integration/save-to-studio.js'
      - 'src/config/material-flow-registry.json'
      - '.github/workflows/stage05-browser-uat.yml'
permissions:
  contents: read
jobs:
  stage05-real-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Stage05 platform and privacy contracts
        run: node --test tests/stage05/material-flow.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify six real consumer browser handoffs using synthetic data
        run: node tests/stage05/consumer-browser-uat.mjs
      - name: Archive screenshot and JSON evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage05-real-consumer-browser-uat
          path: qa-results/stage05/real-consumers/
          retention-days: 14
          if-no-files-found: warn
