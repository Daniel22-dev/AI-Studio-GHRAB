name: Stage 08 Studio consumer independent validation

on:
  push:
    branches: [feature/stage08-groups-consumer-r3-20261026]
  pull_request:
    branches: [candidate]
    paths:
      - "src/groups/group-service.js"
      - "scripts/test-groups.mjs"
      - ".github/workflows/stage08-groups-pr.yml"

permissions:
  contents: read

concurrency:
  group: studio-stage08-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage08-studio-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check group service and test syntax
        run: |
          node --check src/groups/group-service.js
          node --check scripts/test-groups.mjs
      - name: Exercise actual Studio group-service consumer contract
        run: node scripts/test-groups.mjs
  stage08-studio-p5:
    needs: stage08-studio-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned browser testing tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json');if(p.version!=='4.12.1')process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json');if(p.version!=='1.61.1')process.exit(1)"
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Studio current P5 suite as feature-branch evidence (not a promotion)
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
          GHRAB_RELEASE_STAGE: PREP-VALIDATION
        run: npm run qa:p5:ci
      - name: Preserve synthetic CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-stage08-p5-${{ github.sha }}
          path: |
            dist/qa-p5-*.json
            dist/quality-report.json
            qa-results/release-current/
          if-no-files-found: warn
          retention-days: 14
