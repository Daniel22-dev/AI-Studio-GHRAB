name: Stage 5 - patch Generator promotion baseline test

on:
  push:
    branches:
      - stage5-fix-generator-wave-test

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: stage5-fix-generator-wave-test
      - name: Replace fixed Generator wave assertion with monotonic patch-line assertion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/test-release-promotion.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = `assert.equal(actualEntries.get("generator")?.minimumVersion, "7.1.40");
          assert.equal(actualEntries.get("generator")?.expectedStudioBridge, "v2");
          assert.equal(actualWaveEntries.get("generator")?.version, "7.1.40");`;
          const after = `const generatorMinimumVersion = actualEntries.get("generator")?.minimumVersion;
          const generatorWaveVersion = actualWaveEntries.get("generator")?.version;
          assert.equal(generatorMinimumVersion, "7.1.40");
          assert.equal(actualEntries.get("generator")?.expectedStudioBridge, "v2");
          const generatorBaselineComparison = compareVersions(generatorWaveVersion, generatorMinimumVersion);
          assert.notEqual(generatorBaselineComparison, null, "generator: release-wave/minimum must be stable SemVer");
          assert.ok(generatorBaselineComparison >= 0, \`generator: release-wave \${generatorWaveVersion} must not precede reviewed minimum \${generatorMinimumVersion}\`);
          assert.ok(
            ["same", "patch"].includes(classifyVersionChange(generatorMinimumVersion, generatorWaveVersion)),
            \`generator: release-wave \${generatorWaveVersion} must stay on the reviewed 7.1.x patch line\`,
          );`;
          if (!source.includes(before)) throw new Error('Expected fixed Generator wave assertion block not found');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          git diff --check
      - name: Commit exact test fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/test-release-promotion.mjs; then
            echo "Target test already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-release-promotion.mjs
          git commit -m "test: allow verified Generator patch baseline advancement"
          git push origin HEAD:stage5-fix-generator-wave-test
