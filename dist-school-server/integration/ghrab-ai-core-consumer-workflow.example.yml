name: Sync GHRAB AI Core
on:
  repository_dispatch:
    types: [ghrab-ai-core-released]
permissions:
  contents: write
jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Verify expected release
        run: |
          test "${{ github.event.client_payload.coreVersion }}" = "1.0.0"
          test -n "${{ github.event.client_payload.manifestUrl }}"
      - name: Download, verify and integrate
        run: node scripts/sync-ghrab-ai-core.mjs "${{ github.event.client_payload.manifestUrl }}"
      - name: Application and conformance tests
        run: npm test
      - name: Commit verified update
        run: |
          git config user.name "github-actions-bot"
          git config user.email "github-actions-bot"
          git add vendor src package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: sync GHRAB AI Core ${{ github.event.client_payload.coreVersion }}"
          git push
