<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Moje skupiny · AI Studio GHRAB</title><link rel="stylesheet" href="./groups.css"></head><body><main class="groups-shell"><header class="groups-topbar"><div><p>AI Studio GHRAB · 0.21.135</p><h1>Moje skupiny</h1><p>Centrální local-first evidence vyučovacích skupin.</p></div><a class="groups-button groups-button-secondary" href="../">← AI Studio</a></header><section class="groups-toolbar"><div class="groups-filter"><button class="is-active" data-group-filter="active">Aktivní</button><button data-group-filter="archived">Archiv</button></div><div class="groups-backup"><button id="groups-export" class="groups-button groups-button-secondary">Export zálohy</button><label class="groups-button groups-button-secondary">Obnovit zálohu<input id="groups-import-file" type="file" accept="application/json" hidden></label><button id="group-create" class="groups-button groups-button-primary">+ Nová skupina</button></div></section><section class="groups-layout"><aside class="groups-panel"><div id="groups-list" class="groups-list"></div></aside><section id="groups-detail" class="groups-detail" aria-live="polite"></section></section></main>
<dialog id="group-dialog"><div class="dialog-body"><div class="dialog-head"><h2>Skupina</h2><button type="button" data-dialog-close aria-label="Zavřít">×</button></div><form id="group-form" class="groups-form"><input id="group-edit-id" type="hidden"><label>Název<input id="group-name" maxlength="120" required></label><label>Školní rok<input id="group-year" placeholder="2026/27" required></label><label>Předmět<input id="group-subject" maxlength="80"></label><label>Ročník<input id="group-grade" maxlength="40"></label><p id="group-error" class="groups-form-error"></p><div class="groups-dialog-actions"><button type="button" class="groups-button groups-button-secondary" data-dialog-close>Zrušit</button><button class="groups-button groups-button-primary">Uložit</button></div></form></div></dialog>
<dialog id="roster-dialog"><div class="dialog-body"><div class="dialog-head"><div><p>Import z IS</p><h2 id="roster-group-name"></h2></div><button type="button" data-dialog-close aria-label="Zavřít">×</button></div><form id="roster-form" class="groups-form"><label>Vložte seznam<textarea id="roster-input" maxlength="120000" placeholder="Jméno; e-mail nebo tabulka z IS"></textarea></label><label><span><input id="roster-replace" type="checkbox" checked> Archivovat aktivní členy, kteří v novém seznamu chybí</span></label><button id="roster-preview-button" type="button" class="groups-button groups-button-secondary">Zkontrolovat změny</button><div id="roster-preview" class="groups-preview"></div><p id="roster-error" class="groups-form-error"></p><div class="groups-dialog-actions"><button type="button" class="groups-button groups-button-secondary" data-dialog-close>Zrušit</button><button id="roster-confirm" class="groups-button groups-button-primary" disabled>Potvrdit import</button></div></form></div></dialog>
<script type="module" src="./groups.js"></script></body></html>
